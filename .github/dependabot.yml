# Follows the MoJ Developer Portal "Dependabot guidelines":
#   - all minor upgrades share one PR and all patch upgrades share one PR, to cut PR volume
#   - major upgrades are NOT grouped; they get their own PRs
#
# Not covered by Dependabot (CircleCI): orbs and images in .circleci/config.yml.
# See the team note on how those are kept up to date.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Ruby gems (Gemfile / Gemfile.lock)
  # ---------------------------------------------------------------------------
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
      # Our own MoJ gems: we know when they are released, so no need to wait
      exclude:
        - "metadata_presenter"
        - "fb-jwt-auth"
    labels:
      - "dependencies"
      - "ruby"
    groups:
      # All minor upgrades go in a single PR
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
      # All patch upgrades go in a single PR
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

  # ---------------------------------------------------------------------------
  # JavaScript packages (package.json / yarn.lock)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # All minor upgrades go in a single PR
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
      # All patch upgrades go in a single PR
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
