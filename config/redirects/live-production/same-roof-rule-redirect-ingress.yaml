apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    external-dns.alpha.kubernetes.io/set-identifier: same-roof-rule-ingress-formbuilder-services-live-production-green
    nginx.ingress.kubernetes.io/configuration-snippet: |
      server_tokens off;
      location /metrics {
        deny all;
        return 401;
      }
    nginx.ingress.kubernetes.io/custom-http-errors: 400, 401, 403, 404, 500, 503
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://www.gov.uk/claim-compensation-criminal-injury/victim-lived-with-attacker-before-october-1979"
  name: same-roof-rule-ingress
  namespace: formbuilder-services-live-production
spec:
  ingressClassName: default
  rules:
  - host: same-roof-rule.form.service.justice.gov.uk
    http:
      paths:
      - backend:
          service:
            name: same-roof-rule
            port:
              number: 3000
        path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - same-roof-rule.form.service.justice.gov.uk
    secretName: tls-certificate
