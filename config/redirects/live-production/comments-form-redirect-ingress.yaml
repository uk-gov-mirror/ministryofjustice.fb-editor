apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    external-dns.alpha.kubernetes.io/set-identifier: comments-form-ingress-formbuilder-services-live-production-green
    nginx.ingress.kubernetes.io/configuration-snippet: |
      server_tokens off;
      location /metrics {
        deny all;
        return 401;
      }
    nginx.ingress.kubernetes.io/custom-http-errors: 400, 401, 403, 404, 500, 503
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://hmcts-givefeedback-form-eng.form.service.justice.gov.uk"
  name: comments-form-ingress
  namespace: formbuilder-services-live-production
spec:
  ingressClassName: default
  rules:
  - host: comments-form.form.service.justice.gov.uk
    http:
      paths:
      - backend:
          service:
            name: comments-form
            port:
              number: 3000
        path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - comments-form.form.service.justice.gov.uk
    secretName: tls-certificate
